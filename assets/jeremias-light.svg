<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330">
<title>Jeremias Clock: same instant across two cities</title><desc>One winter instant, 16:00 UTC, is 13:00 in Sao Paulo and 16:00 in Dublin.</desc>
<defs><linearGradient id="surface" x2="100%" y2="100%"><stop stop-color="#eef4fd"/><stop offset="1" stop-color="#dceafa"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="328" rx="18" fill="url(#surface)" stroke="#9ab0cf"/>
<g font-family="Consolas, monospace" font-size="15" letter-spacing="2" fill="#265b9f"><text x="36" y="45">01 / DESKTOP PROJECT</text><text x="764" y="45" text-anchor="end" fill="#35774c">OFFLINE PREVIEW</text></g>
<path d="M36 62H764 M36 274H764" fill="none" stroke="#9ab0cf"/>
<text x="36" y="123" font-family="Segoe UI, sans-serif" font-weight="700" font-size="47" fill="#12263e">Jeremias Clock</text>
<text x="38" y="156" font-family="Segoe UI, sans-serif" font-size="20" fill="#415a79">A small desktop companion for work across time zones.</text>
<path d="M400 179V252" fill="none" stroke="#9ab0cf"/>
<g font-family="Consolas, monospace"><text x="38" y="202" font-size="15" letter-spacing="2" fill="#415a79">SÃO PAULO</text><text x="36" y="246" font-size="40" fill="#12263e">13:00</text><text x="208" y="244" font-size="16" fill="#265b9f">UTC−03</text>
<text x="439" y="202" font-size="15" letter-spacing="2" fill="#415a79">DUBLIN</text><text x="437" y="246" font-size="40" fill="#12263e">16:00</text><text x="609" y="244" font-size="16" fill="#9d492c">UTC+00</text>
<text x="37" y="307" font-size="14" fill="#415a79">ONE INSTANT · 25 NOV 2026 · 16:00 UTC</text></g>
<g fill="none" stroke="#35774c" stroke-width="1.5"><circle cx="722" cy="115" r="23"/><path d="M722 101v15h11"/><path d="M678 115h21M745 115h21" stroke="#9ab0cf"/></g>
</svg>
